# S8 — reopen apex auth / portal demos on the production VPS.
# Uses existing VPS_* secrets. Does NOT flip signed installers (D6).
#
#   gh workflow run s8-reopen-demos.yml -f mode=dry-run
#   gh workflow run s8-reopen-demos.yml -f mode=apply
name: s8-reopen-demos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run previews .env change; apply sets VITE_MARKETING_ONLY=false and rebuilds
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

concurrency:
  group: s8-reopen-demos
  cancel-in-progress: false

jobs:
  reopen:
    name: S8 on VPS (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Start ssh-agent (normalize VPS_SSH_KEY newlines)
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}" || { echo "Missing secret VPS_HOST"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: SSH and run deploy/s8-reopen-demos.sh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}" || { echo "Missing secret VPS_HOST"; exit 1; }
          test -n "${VPS_USER:-}" || { echo "Missing secret VPS_USER"; exit 1; }

          REMOTE_CMD='CONFIRM=yes bash deploy/s8-reopen-demos.sh'
          if [[ "$MODE" == "dry-run" ]]; then
            REMOTE_CMD+=' --dry-run'
          fi

          # Diagnose which identities the agent holds (fingerprints only).
          ssh-add -l || true

          ssh -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail
             cd /opt/esti
             git fetch origin main
             git checkout main
             git pull --ff-only origin main
             ${REMOTE_CMD}"
