# S8 — reopen apex auth / portal demos on the production VPS.
# Uses existing VPS_* secrets. Does NOT flip signed installers (D6).
#
#   gh workflow run s8-reopen-demos.yml -f mode=dry-run
#   gh workflow run s8-reopen-demos.yml -f mode=apply
name: s8-reopen-demos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run previews .env change; apply sets VITE_MARKETING_ONLY=false and rebuilds
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

concurrency:
  group: s8-reopen-demos
  cancel-in-progress: false

jobs:
  reopen:
    name: S8 on VPS (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH and run deploy/s8-reopen-demos.sh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}" || { echo "Missing secret VPS_HOST"; exit 1; }
          test -n "${VPS_USER:-}" || { echo "Missing secret VPS_USER"; exit 1; }
          test -n "${VPS_SSH_KEY:-}" || { echo "Missing secret VPS_SSH_KEY"; exit 1; }

          mkdir -p ~/.ssh
          # Preserve PEM newlines from the GitHub secret
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          REMOTE_CMD='CONFIRM=yes bash deploy/s8-reopen-demos.sh'
          if [[ "$MODE" == "dry-run" ]]; then
            REMOTE_CMD+=' --dry-run'
          fi

          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail
             cd /opt/esti
             git fetch origin main
             git checkout main
             git pull --ff-only origin main
             ${REMOTE_CMD}"
